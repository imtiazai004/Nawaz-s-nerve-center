<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e2430" />
    <title>District Nerve Center — Bannu</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --ink: #14171e;
        --paper: #f1eee7;
        --line: #cfc9bb;
        --critical: #8c2f22;
        --pending: #8a6420;
        --ok: #2f5d3a;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-size: 17px;
        line-height: 1.5;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 2px solid var(--ink);
      }
      h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
      main { padding: 1.25rem; max-width: 40rem; }

      /* Connectivity is never implied. The rung is always stated. */
      #status {
        display: block;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      #status[data-state="online"]  { background: #dfe9df; color: var(--ok); }
      #status[data-state="offline"] { background: #f2e3c9; color: var(--pending); }
      #status[data-state="unknown"] { background: #e6e3da; color: #5f6675; }

      label { display: block; margin: 0.9rem 0 0.25rem; font-weight: 600; font-size: 0.9rem; }
      input, select, textarea {
        width: 100%;
        padding: 0.7rem;
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 2px;
      }
      button {
        margin-top: 1.1rem;
        width: 100%;
        padding: 1rem;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--critical);
        border: none;
        border-radius: 2px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }

      #queue { margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
      #queue h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 0.5rem; }
      .entry {
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }
      /* Never a checkmark until the server has confirmed it. */
      .badge { font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
      .badge[data-s="pending"]  { color: var(--pending); }
      .badge[data-s="inflight"] { color: var(--pending); }
      .badge[data-s="blocked"]  { color: var(--critical); }
      .scaffold {
        margin-top: 2rem;
        padding: 0.75rem 1rem;
        border-left: 3px solid var(--line);
        font-size: 0.85rem;
        color: #5f6675;
      }
    </style>
  </head>
  <body>
    <header><h1>District Nerve Center · Bannu</h1></header>
    <div id="status" data-state="online">Checking connection…</div>

    <main>
      <form id="report">
        <label for="category">What happened</label>
        <select id="category" name="category">
          <option value="rta">Road accident</option>
          <option value="fire">Fire</option>
          <option value="flood">Flood</option>
          <option value="medical">Medical emergency</option>
          <option value="security">Security incident</option>
          <option value="other">Other</option>
        </select>

        <label for="severity">How serious</label>
        <select id="severity" name="severity">
          <option value="critical">Critical — life at risk</option>
          <option value="high">High</option>
          <option value="moderate" selected>Moderate</option>
          <option value="low">Low</option>
        </select>

        <label for="place">Where</label>
        <input id="place" name="place" autocomplete="off" placeholder="Village, landmark or road" />

        <button type="submit" id="submit">Report emergency</button>
      </form>

      <section id="queue">
        <h2>Not yet delivered <span id="count">(0)</span></h2>
        <div id="entries"></div>
      </section>

      <p class="scaffold">
        Scaffold only. This exists to prove the app opens and captures a report with no
        network (M0-12). The real intake screen, and its 15-second budget, is M0-36.
      </p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
